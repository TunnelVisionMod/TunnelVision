import groovy.json.JsonOutput
import groovy.json.JsonSlurper

import java.net.http.HttpClient
import java.net.http.HttpRequest
import java.net.http.HttpResponse

// Release tooling for the maintainer.
//
//   ./gradlew release "-Pv=1.4.0"       checks, tags, pushes, waits for CI and publishes

def REPO = "TunnelVisionMod/TunnelVision"
def MINECRAFT_VERSIONS = ["26.1.2", "26.2"]

def run = { List command, boolean allowFailure = false ->
	// Groovy's "v$x" strings are not java.lang.String, which ProcessBuilder insists on.
	def process = new ProcessBuilder(command.collect { it.toString() }).directory(rootDir).redirectErrorStream(true).start()
	def output = process.inputStream.text.trim()
	if (process.waitFor() != 0 && !allowFailure) throw new GradleException("`${command.join(' ')}` failed:\n$output")
	output
}

def parseVersion = { String text ->
	def match = text =~ /^v?(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?$/
	match.matches() ? [match.group(1) as int, match.group(2) as int, match.group(3) as int, match.group(4)] : null
}

def compareVersions = { List a, List b ->
	for (i in 0..2) if (a[i] != b[i]) return a[i] <=> b[i]
	if (a[3] == b[3]) return 0
	if (a[3] == null) return 1
	if (b[3] == null) return -1
	a[3] <=> b[3]
}

tasks.register("release") {
	group = "release"
	description = "Tags, pushes, waits for the CI draft and publishes it. Usage: ./gradlew release \"-Pv=1.4.0\""
	doLast {
		def versionText = project.findProperty("v")?.toString()
		def version = versionText ? parseVersion(versionText) : null
		if (!version) throw new GradleException("Give the version as -Pv=X.Y.Z or -Pv=X.Y.Z-suffix, e.g. ./gradlew release \"-Pv=1.4.0\"")
		def plain = versionText.replaceFirst(/^v/, "")
		def tag = "v$plain"

		// 1. Checks - nothing is changed until all of these pass.
		if (run(["git", "rev-parse", "--abbrev-ref", "HEAD"]) != "main") throw new GradleException("Switch to main first.")
		if (run(["git", "status", "--porcelain"])) throw new GradleException("You have uncommitted changes - commit or stash them first.")
		run(["git", "fetch", "origin", "--tags"])
		if (run(["git", "rev-parse", "HEAD"]) != run(["git", "rev-parse", "origin/main"])) {
			throw new GradleException("Your main is not the same as origin/main - pull or push first.")
		}
		if (run(["git", "tag", "-l", tag])) throw new GradleException("Tag $tag already exists.")

		def token = System.getenv("GITHUB_TOKEN")
		if (!token) {
			def credential = new ProcessBuilder(["git", "credential", "fill"]).directory(rootDir).start()
			credential.outputStream.withWriter { it.write("protocol=https\nhost=github.com\n\n") }
			token = credential.inputStream.text.readLines().find { it.startsWith("password=") }?.substring("password=".length())
			credential.waitFor()
		}
		if (!token) throw new GradleException("No GitHub login found. Push once with git so it is saved, or set GITHUB_TOKEN.")

		def http = HttpClient.newBuilder().followRedirects(HttpClient.Redirect.NEVER).build()
		def json = new JsonSlurper()
		def api = { String method, String url, String body = null, String contentType = "application/json" ->
			def builder = HttpRequest.newBuilder(URI.create(url))
				.header("Authorization", "Bearer $token")
				.header("Accept", "application/vnd.github+json")
				.header("User-Agent", "TunnelVision-Release")
			builder.method(method, body == null ? HttpRequest.BodyPublishers.noBody() : HttpRequest.BodyPublishers.ofString(body))
			if (body != null) builder.header("Content-Type", contentType)
			def response = http.send(builder.build(), HttpResponse.BodyHandlers.ofString())
			[status: response.statusCode(), body: response.body() ? json.parseText(response.body()) : null]
		}

		def latest = api("GET", "https://api.github.com/repos/$REPO/releases/latest")
		if (latest.status == 200) {
			def published = parseVersion(latest.body.tag_name)
			if (published && compareVersions(version, published) <= 0) {
				throw new GradleException("$tag is not higher than the latest release ${latest.body.tag_name}.")
			}
		} else if (latest.status != 404) {
			throw new GradleException("GitHub answered ${latest.status} - is your login allowed to release?")
		}

		// 2. Tag and push.
		logger.lifecycle("Tagging $tag and pushing it...")
		def sha = run(["git", "rev-parse", "HEAD"])
		run(["git", "tag", tag])
		run(["git", "push", "origin", tag])

		// 3. Wait for CI to build the draft.
		def jars = MINECRAFT_VERSIONS.collect { "TunnelVision-v$plain-${it}.jar".toString() }
		def draft = null
		def deadline = System.currentTimeMillis() + 20 * 60 * 1000
		while (draft == null) {
			if (System.currentTimeMillis() > deadline) throw new GradleException("CI did not finish within 20 minutes. Check the Actions tab; once the draft exists, publish it by hand.")
			def runs = api("GET", "https://api.github.com/repos/$REPO/actions/runs?head_sha=$sha&event=push")
			def releaseRun = runs.body?.workflow_runs?.find { it.name == "Release" }
			if (releaseRun?.status == "completed" && releaseRun.conclusion != "success") {
				throw new GradleException("The Release workflow failed: ${releaseRun.html_url}")
			}
			def releases = api("GET", "https://api.github.com/repos/$REPO/releases?per_page=20")
			def candidate = releases.body?.find { it.tag_name == tag }
			if (candidate && jars.every { name -> candidate.assets.any { it.name == name && it.state == "uploaded" } }) {
				draft = candidate
			} else {
				logger.lifecycle("Waiting for CI (${releaseRun?.status ?: "queued"})...")
				Thread.sleep(15_000)
			}
		}

		// 4. Publish.
		def publish = api("PATCH", "https://api.github.com/repos/$REPO/releases/${draft.id}", JsonOutput.toJson([draft: false]))
		if (publish.status != 200) throw new GradleException("Publishing failed with HTTP ${publish.status} - the draft is still there to publish by hand.")
		logger.lifecycle("Released $tag: ${publish.body.html_url}")
	}
}
