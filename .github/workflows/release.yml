name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check tag
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not in the form vX.Y.Z or vX.Y.Z-suffix"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME does not point to a commit on main"
            exit 1
          fi
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - run: chmod +x ./gradlew

      - run: ./gradlew build -Pmod_version="$VERSION" -Pmc=26.2

      - run: ./gradlew build -Pmod_version="$VERSION" -Pmc=26.3

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: TunnelVision ${{ env.VERSION }}
          files: |
            build/libs/TunnelVision-v${{ env.VERSION }}-26.2.jar
            build/libs/TunnelVision-v${{ env.VERSION }}-26.3.jar
          body: |
            ## Requirements

            Download the jar for your Minecraft version (`-26.2` or `-26.3`) and put these in your `mods` folder next to it:

            - Minecraft 26.2 or 26.3 with [Fabric Loader](https://fabricmc.net/use/) 0.19.5+
            - [Fabric API](https://modrinth.com/mod/fabric-api)
            - [Fabric Language Kotlin](https://modrinth.com/mod/fabric-language-kotlin)
            - [Hypixel Mod API](https://modrinth.com/mod/hypixel-mod-api)

            Optional: [Mod Menu](https://modrinth.com/mod/modmenu) to open the settings from the mod list.
          generate_release_notes: true
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
