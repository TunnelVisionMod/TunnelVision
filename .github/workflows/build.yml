name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-version:
    name: build (${{ matrix.mc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ['26.2', '26.3']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - run: chmod +x ./gradlew

      - run: ./gradlew build -Pmc=${{ matrix.mc }}

      - uses: actions/upload-artifact@v7
        with:
          name: TunnelVision-${{ matrix.mc }}
          path: build/libs/TunnelVision-*-${{ matrix.mc }}.jar

  build:
    needs: build-version
    runs-on: ubuntu-latest
    steps:
      - run: echo "Both Minecraft versions built"
